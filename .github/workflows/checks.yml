# The same checks as a dev build (tools/check.sh: the tests, the built pages, the pages in Chromium 120), for pull requests
# and for every branch but dev (dev-build.yml checks dev before it publishes). A branch other than dev builds no package.
name: Checks
on:
  pull_request:
  push:
    branches-ignore: [dev]
    paths-ignore:
      - "docs/**"
      - "zensical.toml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache the Chromium 120 build (webOS 25)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/cleanyourtv
          key: cytv-engines-${{ runner.os }}-chrome-headless-shell-120.0.6099.109
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Development tools (type checks, lint, formatting)
        run: npm ci --no-audit --no-fund
      - name: Checks
        run: CYTV_CHROMIUM_IMAGE=ubuntu:26.04 CYTV_SHOTS=$RUNNER_TEMP/shots sh tools/check.sh --chromium
      - name: Screenshots of the pages in Chromium 120
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chromium-120-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - name: The package builds
        run: python3 ipk/build.py
